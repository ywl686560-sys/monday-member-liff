<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MONDAY 行動會員卡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", Arial, sans-serif;
      background: #f6f1ea;
      color: #2f2a25;
    }

    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.7;
      color: #6a6259;
      margin-bottom: 18px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #f1ece4;
      border-radius: 14px;
      font-size: 13px;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status.success {
      background: #edf7ed;
      color: #2d6a32;
    }

    .status.error {
      background: #fff0ed;
      color: #9b3d2e;
    }

    .hidden {
      display: none !important;
    }

    .form {
      margin-top: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .required {
      color: #b45b46;
      font-size: 12px;
      margin-left: 4px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd2c5;
      border-radius: 14px;
      font-size: 15px;
      background: #fff;
      color: #2f2a25;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2f2a25;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: #8a8177;
      line-height: 1.5;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ddd2c5;
      border-radius: 12px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
    }

    .checkbox-item input {
      width: auto;
    }

    .terms-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 12px;
      background: #f6f1ea;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    .terms-row input {
      width: auto;
      margin-top: 4px;
    }

    .button {
      width: 100%;
      margin-top: 10px;
      padding: 15px 16px;
      border: none;
      border-radius: 15px;
      background: #2f2a25;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .section-title {
      margin-top: 22px;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .member-card {
      background: #ffffff;
      border-radius: 26px;
      padding: 14px;
    }

    .mc-hero {
      overflow: hidden;
      border-radius: 22px;
      background: #f8f4ee;
      border: 1px solid #eee2d2;
      margin-bottom: 14px;
    }

    .mc-hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .mc-identity-row {
      display: grid;
      grid-template-columns: 1fr 88px;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .mc-identity-main {
      background: #fffaf3;
      border: 1px solid #eee2d2;
      border-radius: 18px;
      padding: 14px 16px;
    }

    .mc-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .mc-member-name {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      color: #2f2a25;
    }

    .mc-crown {
      font-size: 22px;
      line-height: 1;
    }

    .mc-id-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .mc-id-label {
      font-size: 14px;
      color: #7a6f63;
    }

    .mc-member-id {
      font-size: 18px;
      font-weight: 800;
      color: #b3893d;
      letter-spacing: 0.03em;
    }

    .mc-tier-mileage {
      padding-top: 8px;
      border-top: 1px dashed #e2d2bd;
      font-size: 15px;
      font-weight: 700;
      color: #463d33;
      line-height: 1.5;
    }

    .mc-badge-box {
      background: #fffaf3;
      border: 1px solid #eee2d2;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .mc-badge-image {
      width: 74px;
      height: 74px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .mc-qr-box {
      background: #fffaf3;
      border: 1px solid #eee2d2;
      border-radius: 22px;
      padding: 14px 14px 12px;
      text-align: center;
      margin-bottom: 14px;
    }

    .mc-qrcode {
      display: flex;
      justify-content: center;
    }

    #memberQrCode img,
    #memberQrCode canvas {
      width: 150px !important;
      height: 150px !important;
    }

    .mc-qr-tip {
      margin-top: 10px;
      font-size: 14px;
      color: #6f6357;
      line-height: 1.4;
    }

    .mc-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .mc-stat-card {
      background: #fffaf3;
      border: 1px solid #eee2d2;
      border-radius: 18px;
      padding: 13px 14px 12px;
      min-height: 102px;
    }

    .mc-stat-label {
      font-size: 15px;
      font-weight: 700;
      color: #6b5f54;
      margin-bottom: 8px;
    }

    .mc-stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #b3893d;
      line-height: 1.2;
    }

    .mc-stat-sub {
      margin-top: 7px;
      font-size: 12px;
      color: #7c7166;
      line-height: 1.45;
      min-height: 18px;
    }

    .mc-updated-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fffaf3;
      border: 1px solid #eee2d2;
      border-radius: 999px;
      padding: 11px 12px;
      font-size: 14px;
      color: #6a6259;
      margin-bottom: 14px;
    }

    .mc-updated-row strong {
      color: #2f2a25;
    }

    .member-benefits-btn {
      width: 100%;
      padding: 16px 18px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(90deg, #caa55a 0%, #e4c88c 100%);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      .page {
        padding: 14px 10px 30px;
      }

      .card {
        padding: 14px;
      }

      .member-card {
        padding: 10px;
      }

      .mc-identity-row {
        grid-template-columns: 1fr 78px;
      }

      .mc-member-name {
        font-size: 24px;
      }

      .mc-member-id {
        font-size: 16px;
      }

      .mc-tier-mileage {
        font-size: 13px;
      }

      .mc-badge-image {
        width: 66px;
        height: 66px;
      }

      .mc-stat-card {
        min-height: 98px;
        padding: 12px;
      }

      .mc-stat-value {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="logo">MONDAY</div>

      <div id="loadingView">
        <div class="title">行動會員卡</div>
        <div class="subtitle">正在準備會員資料，請稍候。</div>
        <div id="status" class="status">LIFF 尚未啟動</div>
      </div>

      <div id="joinView" class="hidden">
        <div class="title">首次入會</div>
        <div class="subtitle">
          歡迎加入 MONDAY 會員。請填寫以下資料，完成後即可建立行動會員卡。
        </div>

        <form id="joinForm" class="form">
          <div class="form-group">
            <label>姓名 / 暱稱 <span class="required">必填</span></label>
            <input id="displayName" type="text" placeholder="請輸入姓名或暱稱" />
          </div>

          <div class="form-group">
            <label>手機號碼 <span class="required">必填</span></label>
            <input id="phone" type="tel" placeholder="請輸入手機號碼" />
          </div>

          <div class="form-group">
            <label>生日 <span class="required">必填</span></label>
            <input id="birthday" type="date" />
            <div class="hint">生日禮將依生日月份發送。</div>
          </div>

          <div class="section-title">小孩生日</div>

          <div class="form-group">
            <label>小孩生日 1</label>
            <input id="childBirthday1" type="date" />
          </div>

          <div class="form-group">
            <label>小孩生日 2</label>
            <input id="childBirthday2" type="date" />
          </div>

          <div class="form-group">
            <label>小孩生日 3</label>
            <input id="childBirthday3" type="date" />
          </div>

          <div class="section-title">關注尺寸</div>

          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="80–90" />80–90</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="90–100" />90–100</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="100–110" />100–110</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="110–120" />110–120</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="120–130" />120–130</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="130–140" />130–140</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="140–150" />140–150</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="150–160" />150–160</label>
            <label class="checkbox-item"><input type="checkbox" name="sizeInterest" value="暫不填寫" />暫不填寫</label>
          </div>

          <div class="section-title">推薦人</div>

          <div class="form-group">
            <label>推薦人ID</label>
            <input id="referrerId" type="text" placeholder="若無推薦人可留空" />
            <div class="hint">若沒有推薦人，系統會記錄為「無推薦人」。</div>
          </div>

          <div class="form-group">
            <div class="terms-row">
              <input id="termsAgreed" type="checkbox" />
              <div>
                我已閱讀並同意 MONDAY 會員條款與個資使用說明。
              </div>
            </div>
          </div>

          <button id="submitButton" class="button" type="button">
            加入 MONDAY 會員
          </button>

          <div id="formStatus" class="status">
            請確認資料正確後送出。
          </div>
        </form>
      </div>

      <div id="memberView" class="hidden">
        <section class="member-card-section">
          <div class="member-card">
            <div class="mc-hero">
              <img
                src="./assets/member-card-hero.png"
                alt="MONDAY Member Club"
                class="mc-hero-image"
              />
            </div>

            <div class="mc-identity-row">
              <div class="mc-identity-main">
                <div class="mc-name-row">
                  <div id="cardMemberName" class="mc-member-name">MONDAY 會員</div>
                  <div class="mc-crown">👑</div>
                </div>

                <div class="mc-id-row">
                  <span class="mc-id-label">會員ID</span>
                  <span id="cardMemberId" class="mc-member-id">M26001</span>
                </div>

                <div id="cardTierMileage" class="mc-tier-mileage">
                  MONDAY Gold｜累積里程 1,000
                </div>
              </div>

              <div class="mc-badge-box">
                <img
                  id="cardBadge"
                  src="./assets/badge-gold.png"
                  alt="會員等級徽章"
                  class="mc-badge-image"
                />
              </div>
            </div>

            <div class="mc-qr-box">
              <div id="memberQrCode" class="mc-qrcode"></div>
              <div class="mc-qr-tip">出示此 QR Code 供店員掃描</div>
            </div>

            <div class="mc-stats-grid">
              <div class="mc-stat-card">
                <div class="mc-stat-label">可用餘額</div>
                <div id="cardBalance" class="mc-stat-value">$0</div>
                <div class="mc-stat-sub"></div>
              </div>

              <div class="mc-stat-card">
                <div class="mc-stat-label">可用禮金</div>
                <div id="cardGift" class="mc-stat-value">$0</div>
                <div class="mc-stat-sub"></div>
              </div>

              <div class="mc-stat-card">
                <div class="mc-stat-label">可用點數</div>
                <div id="cardPoints" class="mc-stat-value">100 點</div>
                <div id="cardPointsNote" class="mc-stat-sub">目前沒有到期提醒</div>
              </div>

              <div class="mc-stat-card">
                <div class="mc-stat-label">優惠券</div>
                <div id="cardCoupons" class="mc-stat-value">0 張</div>
                <div id="cardCouponsNote" class="mc-stat-sub">目前沒有即將到期提醒</div>
              </div>
            </div>

            <div class="mc-updated-row">
              <span>🕒</span>
              <span>資料更新時間：<strong id="cardUpdatedAt">-</strong></span>
            </div>

            <button id="memberBenefitsBtn" class="member-benefits-btn" type="button">
              👑 會員權益說明
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDw1br3b-YEam4pwtUfKGTiKJ8ZJfjXsiguq2wi2VElkF6GsG0I2ChDByEJ-i8KbX9/exec';
    const LIFF_ID = '2010148452-qzfoTN8y';

    let currentLineUserId = '';
    let isSubmitting = false;

    const loadingView = document.getElementById('loadingView');
    const memberView = document.getElementById('memberView');
    const joinView = document.getElementById('joinView');
    const statusEl = document.getElementById('status');
    const formStatus = document.getElementById('formStatus');
    const submitButton = document.getElementById('submitButton');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function setFormStatus(message, type) {
      formStatus.textContent = message;
      formStatus.classList.remove('success', 'error');

      if (type === 'success') {
        formStatus.classList.add('success');
      }

      if (type === 'error') {
        formStatus.classList.add('error');
      }
    }

    function showView(viewName) {
      loadingView.classList.add('hidden');
      memberView.classList.add('hidden');
      joinView.classList.add('hidden');

      if (viewName === 'loading') loadingView.classList.remove('hidden');
      if (viewName === 'member') memberView.classList.remove('hidden');
      if (viewName === 'join') joinView.classList.remove('hidden');
    }

    function formatNumber(value) {
      const number = Number(value || 0);
      return number.toLocaleString('zh-TW');
    }

    async function findMemberByLineUserId(lineUserId) {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'findMemberByLineUserId',
          lineUserId: lineUserId
        })
      });

      return response.json();
    }

    async function loadMemberCard(lineUserId) {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'getMemberCardByLineUserId',
          lineUserId: lineUserId
        })
      });

      const result = await response.json();

      if (!result.ok) {
        throw new Error(result.message || '會員卡資料讀取失敗');
      }

      renderMemberCard(result.card);
    }

    function getBadgeImageByTier(memberTier) {
      const tier = String(memberTier || '').toLowerCase();

      if (tier.includes('silver')) return './assets/badge-gold.png';
      if (tier.includes('gold')) return './assets/badge-gold.png';
      if (tier.includes('platinum')) return './assets/badge-platinum.png';
      if (tier.includes('diamond')) return './assets/badge-diamond.png';

      return './assets/badge-gold.png';
    }

    function renderMemberCard(card) {
      const memberTier = card.memberTier || 'MONDAY Gold';

      document.getElementById('cardMemberName').textContent =
        card.name || 'MONDAY 會員';

      document.getElementById('cardMemberId').textContent =
        card.memberId || '-';

      document.getElementById('cardTierMileage').textContent =
        `${memberTier}｜累積里程 ${formatNumber(card.mileage || 0)}`;

      document.getElementById('cardBalance').textContent =
        `$${formatNumber(card.availableBalance || 0)}`;

      document.getElementById('cardGift').textContent =
        `$${formatNumber(
          card.availableGift ||
          card.availableRewardMoney ||
          card.availableBonus ||
          card.rewardBalance ||
          0
        )}`;

      document.getElementById('cardPoints').textContent =
        `${formatNumber(card.availablePoints || 0)} 點`;

      document.getElementById('cardPointsNote').textContent =
        card.pointsExpireAt
          ? `最晚失效日 ${card.pointsExpireAt}`
          : '目前沒有到期提醒';

      document.getElementById('cardCoupons').textContent =
        `${formatNumber(card.availableCoupons || 0)} 張`;

      document.getElementById('cardCouponsNote').textContent =
        card.recentExpireNotice || '目前沒有即將到期提醒';

      document.getElementById('cardUpdatedAt').textContent =
        card.lastUpdatedAt || '-';

      const badgeEl = document.getElementById('cardBadge');
      badgeEl.src = getBadgeImageByTier(memberTier);
      badgeEl.alt = `${memberTier} Badge`;

      renderMemberQrCode(card.memberId);
      showView('member');
    }

    function renderMemberQrCode(memberId) {
      const qrContainer = document.getElementById('memberQrCode');
      qrContainer.innerHTML = '';

      if (!memberId) return;

      new QRCode(qrContainer, {
        text: memberId,
        width: 150,
        height: 150,
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function setupMemberBenefitsButton() {
      const btn = document.getElementById('memberBenefitsBtn');

      if (!btn) return;

      const benefitsUrl = new URL('./assets/member-benefits.png', window.location.href).href;

      btn.addEventListener('click', function () {
        if (typeof liff !== 'undefined' && liff.openWindow) {
          liff.openWindow({
            url: benefitsUrl,
            external: true
          });
        } else {
          window.open(benefitsUrl, '_blank');
        }
      });
    }

    function renderJoinForm() {
      showView('join');
    }

    function getSelectedSizes() {
      const checked = Array.from(document.querySelectorAll('input[name="sizeInterest"]:checked'));
      return checked.map((item) => item.value).join(',');
    }

    function getJoinFormData() {
      return {
        lineUserId: currentLineUserId,
        displayName: document.getElementById('displayName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        birthday: document.getElementById('birthday').value,
        termsAgreed: document.getElementById('termsAgreed').checked,
        childBirthday1: document.getElementById('childBirthday1').value,
        childBirthday2: document.getElementById('childBirthday2').value,
        childBirthday3: document.getElementById('childBirthday3').value,
        sizeInterest: getSelectedSizes() || '暫不填寫',
        referrerId: document.getElementById('referrerId').value.trim() || '無推薦人'
      };
    }

    function validateJoinForm(data) {
      if (!data.lineUserId) {
        return '尚未取得 LINE User ID，請重新開啟會員卡';
      }

      if (!data.displayName) {
        return '請填寫姓名 / 暱稱';
      }

      if (!data.phone) {
        return '請填寫手機號碼';
      }

      if (!data.birthday) {
        return '請填寫生日';
      }

      if (!data.termsAgreed) {
        return '請先勾選同意會員條款';
      }

      return '';
    }

    async function createMember(memberData) {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'createMember',
          member: memberData
        })
      });

      return response.json();
    }

    async function handleJoinSubmit() {
      if (isSubmitting) {
        return;
      }

      const memberData = getJoinFormData();
      const errorMessage = validateJoinForm(memberData);

      if (errorMessage) {
        setFormStatus(errorMessage, 'error');
        return;
      }

      isSubmitting = true;
      submitButton.disabled = true;
      submitButton.textContent = '正在建立會員資料...';
      setFormStatus('正在建立會員資料，請勿重複點擊。', '');

      try {
        const createResult = await createMember(memberData);

        if (!createResult.ok) {
          throw new Error(createResult.error || '建立會員失敗');
        }

        const checkResult = await findMemberByLineUserId(currentLineUserId);

        if (checkResult.ok && checkResult.found) {
          setFormStatus('入會成功，正在顯示會員卡。', 'success');
          await loadMemberCard(currentLineUserId);
          return;
        }

        throw new Error('會員建立完成，但查詢會員資料失敗，請稍後重新開啟會員卡');
      } catch (error) {
        setFormStatus('送出失敗：' + error.message, 'error');
        submitButton.disabled = false;
        submitButton.textContent = '加入 MONDAY 會員';
        isSubmitting = false;
      }
    }

    async function main() {
      try {
        showView('loading');
        setStatus('正在初始化 LIFF...');

        if (typeof liff === 'undefined') {
          throw new Error('LIFF SDK 載入失敗');
        }

        await liff.init({
          liffId: LIFF_ID
        });

        setStatus('LIFF 初始化完成，檢查 LINE 登入狀態...');

        if (!liff.isLoggedIn()) {
          setStatus('尚未登入 LINE，準備登入...');
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentLineUserId = profile.userId;

        setStatus('已取得 LINE User ID，準備查詢會員：' + currentLineUserId);

        const data = await findMemberByLineUserId(currentLineUserId);

        if (data.ok && data.found) {
          await loadMemberCard(currentLineUserId);
        } else {
          renderJoinForm();
        }
      } catch (error) {
        showView('loading');
        setStatus('發生錯誤：' + error.message);
      }
    }

    submitButton.addEventListener('click', handleJoinSubmit);
    setupMemberBenefitsButton();
    main();
  </script>
</body>
</html>
